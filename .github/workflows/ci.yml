name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      # next build compiles every route, which catches import and syntax errors
      # that lint does not. There is no type checking to do here: the app is
      # JavaScript with a jsconfig, not TypeScript. Note also that next lint
      # exits 0 on warnings, so this job fails only on lint errors or a broken
      # build. With no test suite, that is the whole gate.
      #
      # No environment variables are needed: utils/db.js creates the Neon
      # client lazily, so a missing DATABASE_URL does not break the build, and
      # Clerk does not require its keys to compile.
      - run: npm run build
