name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      # next build compiles every route, which catches import and syntax errors
      # that lint does not. There is no type checking to do here: the app is
      # JavaScript with a jsconfig, not TypeScript. Note also that next lint
      # exits 0 on warnings, so this job fails only on lint errors or a broken
      # build. With no test suite, that is the whole gate.
      #
      # DATABASE_URL is still not needed: utils/db.js creates the Neon client
      # lazily, so a missing connection string does not break the build.
      #
      # The Clerk key is a different matter as of v6. v5 compiled without one;
      # v6 hard-fails while prerendering every page inside <ClerkProvider>.
      # The value below is a placeholder, not this project's key: it is only
      # parsed for its shape, nothing in CI authenticates against Clerk, and the
      # bundle this job produces is thrown away. Publishable keys are public by
      # design in any case, since they ship inside the client bundle. The secret
      # key is not required here and is deliberately absent.
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
